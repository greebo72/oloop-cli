[project]
name = "oloop"
version = "0.1.0"
description = "Lokaler Cross-Projekt-Tracker (Markdown + YAML-Frontmatter)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
    "rfc3339-validator",
    "markdown-it-py>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
oloop = "oloop.cli:main"

[tool.setuptools]
packages = ["oloop"]

[tool.setuptools.package-data]
oloop = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
