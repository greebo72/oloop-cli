[project]
name = "lagebericht"
version = "0.1.0"
description = "Lokaler Cross-Projekt-Tracker (Markdown + YAML-Frontmatter)"
requires-python = ">=3.11"
dependencies = ["pyyaml", "jsonschema", "rfc3339-validator"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
lagebericht = "lagebericht.cli:main"

[tool.setuptools]
packages = ["lagebericht"]

[tool.setuptools.package-data]
lagebericht = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
